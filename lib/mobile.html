<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>我的基金</title>
<style>
  :root{
    --bg:#f6f6f7; --card:#ffffff; --line:#e8e8ea; --txt:#111114; --dim:#8a8a92;
    --up:#e5453c; --down:#1f9d55; --brand:#f0a020;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16161a; --card:#1f1f24; --line:#2c2c33; --txt:#f2f2f4; --dim:#9a9aa4;
           --up:#ff6b61; --down:#3ecf8e; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{padding:max(12px,env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
  .head h1{font-size:16px;margin:0;font-weight:650}
  .head .when{font-size:11px;color:var(--dim)}
  .refresh{border:1px solid var(--line);background:var(--card);color:var(--txt);
    border-radius:999px;padding:6px 12px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .hero .label{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .hero .big{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:2px 0 6px}
  .tag{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(240,160,32,.16);color:var(--brand)}
  .tag.n{background:rgba(128,128,140,.16);color:var(--dim)}
  .spark{display:block;width:100%;height:52px;margin:2px 0 8px}
  .legend{display:flex;gap:12px;align-items:center;font-size:10.5px;color:var(--dim);margin-bottom:8px}
  .legend i{display:inline-block;width:14px;height:2px;border-radius:1px;background:var(--up);margin-right:5px;vertical-align:middle}
  .legend i.d{border-top:1px dashed var(--line);height:0;background:none}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
  .k{font-size:10.5px;color:var(--dim)}
  .v{font-size:14px;font-weight:600;margin-top:2px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  .idx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .idx span{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px}
  .sec b{font-size:12.5px;font-weight:650}
  .sec em{font-style:normal;font-size:10.5px;color:var(--dim)}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .row .nm{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .cd{font-size:10.5px;color:var(--dim)}
  .row .pct{font-size:12px;font-weight:650}
  .mgrid{display:grid;grid-template-columns:.9fr 1fr .9fr 1.1fr;gap:6px;margin-top:8px}
  .mk{font-size:10px;color:var(--dim)}
  .mv{font-size:12.5px;font-weight:600;margin-top:1px}
  .src{font-size:9.5px;color:var(--brand);margin-top:1px}
  .src.n{color:var(--dim)}
  .sub{font-size:9.5px;color:var(--dim);margin-top:1px}
  .note{font-size:10px;color:var(--dim);margin-top:6px}
  .plan{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .plan .nm{font-size:12.5px;font-weight:600}
  .plan .meta{font-size:10.5px;color:var(--dim);margin-top:2px}
  .foot{font-size:10px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.8}
  .err{background:rgba(229,69,60,.12);color:var(--up);font-size:11.5px;padding:8px 10px;border-radius:10px;margin-bottom:10px}
  .empty{text-align:center;color:var(--dim);font-size:12px;padding:28px 10px;border:1px dashed var(--line);border-radius:14px}
  .skel{height:88px;border-radius:16px;background:var(--line);opacity:.5;margin-bottom:12px;
    animation:pulse 1.4s ease-in-out infinite}
  .skel.s2{height:64px}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.7}}
</style>
</head>
<body>
<div class="head">
  <h1>我的基金</h1>
  <button class="refresh" id="rf">刷新</button>
</div>
<div id="app"><div class="skel"></div><div class="skel s2"></div><div class="skel s2"></div></div>

<script>
(function () {
  var app = document.getElementById('app');
  var rf = document.getElementById('rf');
  var api = '/my-funds/api/';
  var timer = null;

  function money(n) {
    if (n == null || isNaN(n)) return '--';
    var v = Number(n);
    return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function signed(n) {
    if (n == null || isNaN(n)) return '--';
    var v = Number(n);
    return (v > 0 ? '+' : '') + money(v);
  }
  function tone(n) { return n > 0.004 ? 'up' : n < -0.004 ? 'down' : 'flat'; }
  function pct(n) {
    if (n == null || isNaN(n)) return '';
    var v = Number(n);
    return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  var SRC = { import: '当日实际', gsz: '盘中估值', sector: '板块估算', nav: '今日净值', prev: '昨日净值' };

  function spark(series) {
    if (!series || series.length < 2) return '';
    var w = 300, h = 52, i;
    var vals = series.map(function (p) { return p.value; });
    var costs = series.map(function (p) { return p.cost == null ? p.value : p.cost; });
    var min = Math.min.apply(null, vals.concat(costs));
    var max = Math.max.apply(null, vals.concat(costs));
    var span = max - min || 1;
    function line(list) {
      return list.map(function (v, k) {
        var x = (k / (list.length - 1)) * w;
        var y = h - ((v - min) / span) * (h - 8) - 4;
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
    }
    var tone2 = vals[vals.length - 1] >= vals[0] ? 'var(--up)' : 'var(--down)';
    var area = 'M0,' + h + ' L' + line(vals).split(' ').join(' L') + ' L' + w + ',' + h + ' Z';
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">'
      + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="' + tone2 + '" stop-opacity=".26"/>'
      + '<stop offset="100%" stop-color="' + tone2 + '" stop-opacity="0"/></linearGradient></defs>'
      + '<path d="' + area + '" fill="url(#g)"/>'
      + '<polyline points="' + line(costs) + '" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>'
      + '<polyline points="' + line(vals) + '" fill="none" stroke="' + tone2 + '" stroke-width="2" stroke-linejoin="round"/>'
      + '</svg>';
  }

  function render(data) {
    var s = data.summary || {};
    var rows = (data.holdings || []).slice().sort(function (a, b) { return b.value - a.value; });
    var plans = data.plans || [];
    var html = '';

    html += '<div class="card hero">'
      + '<div class="label">总市值 <span class="tag' + (s.estimated ? '' : ' n') + '">'
      + (s.estimated ? '盘中估算' : '已收盘') + '</span></div>'
      + '<div class="big num">' + money(s.value) + '</div>'
      + spark(data.series)
      + (data.series && data.series.length > 1
        ? '<div class="legend"><span><i></i>总市值</span><span><i class="d"></i>累计投入</span></div>' : '')
      + '<div class="grid3">'
      + '<div><div class="k">今日盈亏</div><div class="v num ' + tone(s.todayProfit) + '">' + signed(s.todayProfit)
      + '<span style="font-size:11px;font-weight:500"> ' + pct(s.todayPct) + '</span></div></div>'
      + '<div><div class="k">持有收益</div><div class="v num ' + tone(s.profit) + '">' + signed(s.profit) + '</div></div>'
      + '<div><div class="k">累计投入</div><div class="v num">' + money(s.cost) + '</div></div>'
      + '</div>'
      + ((data.indexes || []).length
        ? '<div class="idx">' + data.indexes.map(function (x) {
          return '<span>' + esc(x.name) + ' <b class="' + tone(x.chgPct) + '">' + pct(x.chgPct) + '</b></span>';
        }).join('') + '</div>'
        : '')
      + '</div>';

    html += '<div class="sec"><b>持仓 ' + rows.length + '</b><em>' + (s.estimated ? '盘中估算' : '') + '</em></div>';
    if (!rows.length) {
      html += '<div class="empty">还没有持仓，回到电脑上的「我的基金」面板导入截图</div>';
    } else {
      html += rows.map(function (r) {
        var sector = r.sector && typeof r.sector.chgPct === 'number' ? r.sector : null;
        return '<div class="row">'
          + '<div class="top"><div class="nm">' + esc(r.name || r.code) + '</div>'
          + '<div class="cd">' + esc(r.code) + '</div>'
          + '<div class="pct ' + tone(r.todayPct) + '">' + pct(r.todayPct) + '</div></div>'
          + '<div class="mgrid">'
          + '<div><div class="mk">市值</div><div class="mv num">' + money(r.value) + '</div></div>'
          + '<div><div class="mk">今日盈亏</div><div class="mv num ' + tone(r.todayProfit) + '">' + signed(r.todayProfit) + '</div>'
          + '<div class="src' + (r.daySource === 'import' ? '' : ' n') + '">' + (SRC[r.daySource] || '') + '</div></div>'
          + '<div><div class="mk">持有收益</div><div class="mv num ' + tone(r.profit) + '">' + signed(r.profit) + '</div></div>'
          + '<div><div class="mk">关联板块</div>'
          + (sector
            ? '<div class="mv num ' + tone(sector.chgPct) + '">' + pct(sector.chgPct) + '</div><div class="sub">' + esc(sector.label) + '</div>'
            : '<div class="mv flat">--</div>')
          + '</div></div>'
          + (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '')
          + '</div>';
      }).join('');
    }

    html += '<div class="sec"><b>定投计划 ' + plans.length + '</b></div>';
    if (!plans.length) {
      html += '<div class="empty">还没有定投计划</div>';
    } else {
      html += plans.map(function (p) {
        var next = (p.nextDates || [])[0] || '';
        return '<div class="row"><div class="plan"><div>'
          + '<div class="nm">' + esc(p.name || p.code) + '</div>'
          + '<div class="meta">每期 ' + money(p.amount) + ' · 已投 ' + money(p.invested) + '</div>'
          + '</div><div style="text-align:right">'
          + '<div class="mv num">' + (next || '--') + '</div><div class="sub">下次扣款</div>'
          + '</div></div></div>';
      }).join('');
    }

    html += '<div class="foot">更新于 ' + new Date(data.updatedAt || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
      + ' · ' + (data.trading ? '盘中每分钟刷新' : '收盘后每 5 分钟刷新')
      + '<br>数据：天天基金 / 东方财富</div>';

    app.innerHTML = html;
  }

  function load() {
    fetch(api + 'state', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error && j.error.message) || '读取失败');
        render(j.value);
        schedule(j.value.trading ? 60000 : 300000);
      })
      .catch(function (err) {
        app.innerHTML = '<div class="err">' + esc(err.message || err) + '</div>'
          + '<div class="empty">点右上角刷新重试</div>';
        schedule(60000);
      });
  }

  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      if (document.hidden) return schedule(ms);
      load();
    }, ms);
  }

  rf.addEventListener('click', function () { rf.textContent = '刷新中'; load(); setTimeout(function () { rf.textContent = '刷新'; }, 900); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
